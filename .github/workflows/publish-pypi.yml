# Publish atlas-badges to PyPI using trusted publishing (OIDC).
# No PyPI token is stored anywhere; id-token: write is what lets this
# workflow prove its identity to PyPI directly.
#
# Prerequisite, only doable by you, on pypi.org, before this workflow
# can succeed even once: register a pending trusted publisher for
# "atlas-badges" at https://pypi.org/manage/account/publishing/,
# pointing at:
#   Repository:  AtlasReaper311/atlas-badges
#   Workflow:    publish-pypi.yml
#   Environment: pypi
# The environment name below must match whatever you register there.

name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, Node 24

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0, Node 24
        with:
          python-version: "3.12"

      - name: Confirm pyproject.toml version matches the pushed tag
        run: |
          PACKAGE_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "pyproject.toml version ($PACKAGE_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Install publishing tooling
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Mint PyPI trusted publishing token
        id: pypi-token
        shell: bash
        run: |
          set -euo pipefail

          oidc_response="$(curl -fsS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=pypi")"
          oidc_token="$(jq -r '.value' <<<"${oidc_response}")"

          token_response="$(curl -fsS \
            -X POST "https://pypi.org/_/oidc/mint-token" \
            -H "Content-Type: application/json" \
            -d "{\"token\":\"${oidc_token}\"}")"
          api_token="$(jq -r '.token' <<<"${token_response}")"

          echo "::add-mask::${api_token}"
          echo "api-token=${api_token}" >> "${GITHUB_OUTPUT}"

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ steps.pypi-token.outputs.api-token }}
        run: python -m twine upload dist/*
